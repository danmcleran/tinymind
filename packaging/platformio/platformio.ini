; A PlatformIO project that uses this checkout as the tinymind library, for
; CI: the native environment builds and runs the shared self-test on the host,
; nucleo_f411re builds it for a Cortex-M4 (STM32Cube, no board needed).
; A project of your own would write `lib_deps = tinymind` (from the
; registry) or a git URL instead of the symlink.

[env]
lib_deps = tinymind=symlink://../..
; Build-wide, so the library's sources (the lookup tables) and the project's
; agree: the int8 layers, and the Q8.8 tanh table the check links.
build_flags =
    -DTINYMIND_ENABLE_QUANTIZATION=1
    -DTINYMIND_USE_TANH_8_8=1
; Warnings are errors in the project's own source only: the STM32Cube HAL
; that the framework compiles is not warning-free.
build_src_flags = -Wall -Wextra -Werror

[env:native]
platform = native

[env:nucleo_f411re]
platform = ststm32
board = nucleo_f411re
framework = stm32cube
