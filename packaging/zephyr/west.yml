# The west workspace the packaging CI job builds the Zephyr sample in: Zephyr
# at a pinned release, with only the modules qemu_cortex_m3 needs. tinymind
# itself comes in through ZEPHYR_EXTRA_MODULES. A project of your own would
# list tinymind here instead, as a west project:
#
#   - name: tinymind
#     url: https://github.com/danmcleran/tinymind
#     revision: v19.1
#     path: modules/lib/tinymind
manifest:
  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos
  projects:
    - name: zephyr
      remote: zephyrproject-rtos
      revision: v4.3.2
      import:
        name-allowlist:
          - cmsis_6
          - cmsis
