# ESP-IDF component manifest. The component itself is the CMakeLists.txt at
# the repository root (its ESP_PLATFORM branch).
version: "20.0.0"
description: "Header-only C++14 neural networks and Q-learning for microcontrollers: fixed-point and int8 layers, no heap, int8 models imported from TFLite, ONNX and PyTorch."
url: "https://danmcleran.github.io/tinymind/"
repository: "https://github.com/danmcleran/tinymind.git"
license: "MIT"
tags:
  - neural-network
  - tinyml
  - int8
  - quantization
  - machine-learning
dependencies:
  idf: ">=5.0"
files:
  include:
    - "CMakeLists.txt"
    - "idf_component.yml"
    - "LICENSE.txt"
    - "README.md"
    - "cpp/**/*"
  exclude:
    - "**/AGENTS.md"
    - "**/CLAUDE.md"
