sentence=Header-only C++14 neural networks and Q-learning for microcontrollers: fixed-point and int8 layers, no heap, no FPU required.
paragraph=Runs int8 models imported from TensorFlow Lite, ONNX and PyTorch bit-exact with TensorFlow Lite for Microcontrollers, streams time-series models one frame at a time, and trains fixed-point networks on the device. Needs a core that compiles C++14 or later (for example Arduino Mbed OS boards); AVR cores compile C++11 and are not supported.
