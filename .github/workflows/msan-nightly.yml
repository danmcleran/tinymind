name: MSan (nightly, instrumented libc++)

# MemorySanitizer over the Boost unit-test suites, NOT a PR gate.
#
# The blocking `MSan (uninitialized reads)` job in analysis.yml covers
# unit_test/embedded only. That scope is not a preference: MSan requires every
# linked object to be instrumented, and against a stock libstdc++ the Boost
# suites abort inside Boost.Test's own static initialization before reaching
# any TinyMind code. The reports are artifacts of the uninstrumented runtime,
# not findings.
#
# That gap matters, because it is exactly where the real bug lived. The
# static-initialization-order UB fixed in #171 -- which had a Q-learning suite
# training on all-zero weights and passing in 17ms for entirely the wrong
# reason -- sat in a Boost suite, invisible to ASan, UBSan, and the embedded
# MSan job alike.
#
# Closing it needs a C++ runtime built with MSan. This job builds libc++ and
# libc++abi from llvm-project with -fsanitize=memory, caches the result, and
# runs the Boost suites against it. The build is 10-20 minutes cold, which is
# the wrong shape for a per-PR gate and the right shape for a nightly: the
# suites themselves then run in seconds.
#
# The libc++ build is keyed on the LLVM version so a toolchain bump rebuilds
# it. Deleting the cache key is always safe; it just costs one cold build.
#
# Note on Boost: the suites use <boost/test/included/unit_test.hpp>, the
# header-only variant, so Boost.Test itself is compiled into each translation
# unit and gets instrumented along with it. No separate instrumented Boost is
# needed -- the C++ runtime was the only uninstrumented piece.

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC daily, an hour after the fuzz run
  workflow_dispatch:
  # TEMPORARY -- remove before merge. workflow_dispatch only fires for
  # workflows already on the default branch, so this is the only way to
  # actually run this job before it lands. It is here to prove the libc++
  # build, the teeth check and the suites all work, not to gate PRs.
  pull_request:
    paths:
      - '.github/workflows/msan-nightly.yml'
      - 'Makefile'

permissions:
  contents: read

env:
  LLVM_VERSION: "18.1.8"

jobs:
  msan-libcxx:
    name: MSan over Boost suites (instrumented libc++)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Clang, Boost and build tools
        uses: ./.github/actions/apt-install
        with:
          packages: clang cmake ninja-build libboost-dev libboost-test-dev

      - name: Restore MSan-instrumented libc++
        id: libcxx-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: msan-libcxx
          key: msan-libcxx-${{ env.LLVM_VERSION }}-${{ runner.os }}

      # Only the runtimes are built, not the compiler: the distro clang does
      # the compiling, and this supplies it with an instrumented libc++ to
      # link against. That is what keeps a cold build in minutes rather than
      # hours.
      - name: Build libc++ with MemorySanitizer
        if: steps.libcxx-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "llvmorg-${LLVM_VERSION}" \
            https://github.com/llvm/llvm-project.git llvm-project
          cmake -G Ninja -S llvm-project/runtimes -B libcxx-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DLLVM_ENABLE_RUNTIMES="libcxx;libcxxabi" \
            -DLLVM_USE_SANITIZER=MemoryWithOrigins \
            -DCMAKE_INSTALL_PREFIX="$PWD/msan-libcxx"
          ninja -C libcxx-build cxx cxxabi
          ninja -C libcxx-build install-cxx install-cxxabi
          rm -rf llvm-project libcxx-build

      - name: Save MSan-instrumented libc++
        if: steps.libcxx-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: msan-libcxx
          key: msan-libcxx-${{ env.LLVM_VERSION }}-${{ runner.os }}

      # Teeth check. A sanitizer job that reports nothing is indistinguishable
      # from one that is not working, and this series has already produced two
      # such false greens. Plant an uninitialized read and require MSan to
      # catch it before trusting anything the real run says. Also pins the
      # reason for -O0: at -O1+ the optimizer folds the undef away before
      # instrumentation sees it, which would leave this job green and blind.
      - name: Verify MSan actually reports (teeth check)
        run: |
          set -euo pipefail
          cat > /tmp/teeth.cpp <<'EOF'
          #include <cstdio>
          int main() { int u[4]; u[1] = 2; if (u[0] > 0) { printf("x\n"); } return 0; }
          EOF
          clang++ -std=c++17 -stdlib=libc++ -nostdinc++ \
            -isystem "$PWD/msan-libcxx/include/c++/v1" \
            -L "$PWD/msan-libcxx/lib" -Wl,-rpath,"$PWD/msan-libcxx/lib" \
            -fsanitize=memory -fsanitize-memory-track-origins=2 \
            -fno-omit-frame-pointer -O0 -g -o /tmp/teeth /tmp/teeth.cpp
          if /tmp/teeth 2>/tmp/teeth.err; then
            echo "TEETH CHECK FAILED: MSan did not report a planted uninitialized read."
            echo "This job would be green and blind. Refusing to continue."
            cat /tmp/teeth.err || true
            exit 1
          fi
          grep -q "MemorySanitizer" /tmp/teeth.err || {
            echo "TEETH CHECK FAILED: non-zero exit but no MemorySanitizer report."; cat /tmp/teeth.err; exit 1; }
          echo "Teeth check passed: MSan reports the planted read."

      - name: Run the Boost suites under MSan
        env:
          BOOST_HOME: /usr
        run: |
          make check-msan-libcxx MSAN_LIBCXX_PREFIX="$PWD/msan-libcxx"

      - name: Upload MSan reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: msan-reports
          path: msan-*.log
          if-no-files-found: ignore
